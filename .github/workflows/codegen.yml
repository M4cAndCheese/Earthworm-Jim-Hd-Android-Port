name: Codegen Earthworm Jim HD (private)

# Private repo only: this job handles the game data and the generated code.
# Never run it in the public repo, its artifacts would be downloadable by anyone.

on:
  workflow_dispatch:
  push:
    paths:
      - "ewj/**"
      - "tools/**"
      - ".github/workflows/codegen.yml"

permissions:
  contents: read

env:
  GAME_TAG: game-data-v1
  SDK_TAG: sdk-rexglue-0.10.0
  SDK_REPO: M4cAndCheese/Earthworm-Jim-Hd-Android-Port
  # default.xex of ReXGlue's supported build (version 1.0.0.11)
  DEFAULT_XEX_SHA1: 62d9d28a3bce42843607c26ab4b200e91cb31203

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (ewj/ and tools/ only)
        uses: actions/checkout@v5

      - name: Download game data from private release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GAME_TAG" --pattern game-data.zip --dir .
          mkdir -p ewj/assets
          unzip -q game-data.zip -d ewj/assets
          rm game-data.zip
          echo "$DEFAULT_XEX_SHA1  ewj/assets/default.xex" | sha1sum -c -

      - name: Download ReXGlue host SDK (official Linux x86_64 build)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$SDK_TAG" --repo "$SDK_REPO" --pattern '*linux*' --dir sdk
          mkdir -p sdk/host
          for z in sdk/*.zip; do unzip -q "$z" -d sdk/host; done
          REXGLUE=$(find sdk/host -name rexglue -type f | head -n 1)
          chmod +x "$REXGLUE"
          echo "REXGLUE=$PWD/$REXGLUE" >> "$GITHUB_ENV"
          LIBDIR=$(dirname "$(find sdk/host -name librexruntime.so | head -n 1)")
          echo "LD_LIBRARY_PATH=$PWD/$LIBDIR" >> "$GITHUB_ENV"

      - name: Run codegen
        run: |
          cd ewj
          "$REXGLUE" codegen earthworm_jim_hd_manifest.toml
          test -n "$(find generated/default -name '*.cpp' | head -n 1)"

      - name: Patch setjmp/longjmp call sites
        run: |
          cmake "-DGENERATED=$PWD/ewj/generated/default" -P tools/patch_setjmp.cmake

      - name: Upload generated code (private)
        uses: actions/upload-artifact@v4
        with:
          name: ewj-generated-code
          path: ewj/generated/
          retention-days: 7
          if-no-files-found: error
