name: Build Android APK

# Public build: the app without game code. The playable APK (with the game) is
# built in the private repo, ewj-game-private, by build-game-apk.yml.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK, NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Fetch SDL 3.5.0 Java glue
        run: sh tools/fetch-sdl-java.sh

      - name: Fetch ReXGlue Android SDK
        run: |
          curl -fL -o rexglue-android.zip \
            "https://github.com/M4cAndCheese/Earthworm-Jim-Hd-Android-Port/releases/download/sdk-rexglue-0.10.0/rexglue-android-arm64-sdk.zip"
          mkdir sdk-android
          unzip -q rexglue-android.zip -d sdk-android

      - name: Stage runtime libraries
        run: sh tools/stage-sdk.sh sdk-android "$ANDROID_SDK_ROOT/ndk/28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        env:
          REXSDK_ANDROID_DIR: ${{ github.workspace }}/sdk-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarthwormJimHD-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
